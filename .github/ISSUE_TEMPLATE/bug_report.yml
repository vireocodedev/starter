name: Bug report
description: Report a reproducible defect in a supported Vireo release
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Follow SECURITY.md for private reporting.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a security report.
          required: true
        - label: I reproduced this with a supported published release or explained why I could not.
          required: true
  - type: input
    id: artifact-version
    attributes:
      label: Affected artifact and version
      description: Include every affected npm package or Maven coordinate and exact version.
      placeholder: "@vireocodedev/ui 0.2.1"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a small repository, test, or exact sequence that uses public artifacts.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: State what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, runtime, package manager, browser or JVM, and relevant configuration.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add sanitized logs, screenshots, or other relevant details.
