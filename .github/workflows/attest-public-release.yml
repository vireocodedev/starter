name: Attest public release SBOMs

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish npm release
      - Verify Maven Central release
    branches: [main]
    types:
      - completed

concurrency:
  group: attest-public-release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  attest:
    name: Bind SBOMs to exact public artifacts
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: corepack npm ci --ignore-scripts
      - name: Collect exact public artifacts and current SBOMs
        run: corepack npm run release:collect-public-evidence
      - name: Require a clean source checkout
        run: test -z "$(git status --porcelain)"
      - name: Attest the npm SBOM to all seven public tarballs
        id: npm-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: .public-release-evidence/npm-subjects.sha256
          sbom-path: .public-release-evidence/sbom/npm.cdx.json
      - name: Attest the JVM SBOM to all 27 public Maven artifacts
        id: maven-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: .public-release-evidence/maven-subjects.sha256
          sbom-path: .public-release-evidence/sbom/jvm.cdx.json
      - name: Verify the published attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for subject in .public-release-evidence/subjects/npm/* .public-release-evidence/subjects/maven/*; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://cyclonedx.org/bom \
              --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/attest-public-release.yml@refs/heads/main" \
              --source-ref refs/heads/main
          done
      - name: Preserve exact-byte evidence and signed bundles
        if: >-
          always() &&
          steps.npm-attestation.outcome == 'success' &&
          steps.maven-attestation.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-release-sbom-attestations-${{ github.event.workflow_run.head_sha || github.sha }}
          path: |
            .public-release-evidence
            ${{ steps.npm-attestation.outputs.bundle-path }}
            ${{ steps.maven-attestation.outputs.bundle-path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
