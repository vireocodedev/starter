name: Verify · Website
run-name: Website verification · PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: website-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build standalone website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan exact website verification from trusted base policy
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          planner_root="$RUNNER_TEMP/ci-change-plan-base"
          if git cat-file -e "$BASE_SHA:scripts/ci-change-plan.mjs" && git cat-file -e "$BASE_SHA:contracts/ci-change-plan-policy.json" && git show "$BASE_SHA:contracts/ci-change-plan-policy.json" | node -e 'const policy=JSON.parse(require("node:fs").readFileSync(0,"utf8")); process.exit(policy.schemaVersion===1&&["publicBetaEvidence","documentationPages"].every(name=>policy.scopes?.[name])?0:1)'; then
            git worktree add --detach "$planner_root" "$BASE_SHA"
            trap 'git worktree remove --force "$planner_root"' EXIT
            node "$planner_root/scripts/ci-change-plan.mjs" --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
          else
            cat >> "$GITHUB_OUTPUT" <<'EOF'
          typescript=true
          jvm=true
          generated-frontend=true
          generated-fullstack=true
          project-upgrade=true
          gauntlet-plan=true
          website=true
          codeql-java=true
          codeql-javascript=true
          dependency-review=true
          public-beta-evidence=true
          documentation-pages=true
          full=true
          reason=base-planner-unavailable; running complete suite
          EOF
          fi
      - name: Summarize website routing
        env:
          SHOULD_BUILD: ${{ steps.plan.outputs.website }}
        run: |
          case "$SHOULD_BUILD" in true|false) ;; *) exit 1 ;; esac
          printf '## Website verification\n\n- Build selected: `%s`\n' "$SHOULD_BUILD" >> "$GITHUB_STEP_SUMMARY"
      - name: Install website runtime dependencies
        if: steps.plan.outputs.website == 'true'
        run: corepack npm ci --ignore-scripts
      - name: Lint website source
        if: steps.plan.outputs.website == 'true'
        run: corepack npm exec -- eslint site
      - name: Check website formatting
        if: steps.plan.outputs.website == 'true'
        run: corepack npm exec -- prettier --check site
      - name: Verify source policy
        if: steps.plan.outputs.website == 'true'
        run: node site/verify.mjs
      - name: Test website rendering
        if: steps.plan.outputs.website == 'true'
        run: node --test site/build.test.mjs
      - name: Build standalone artifact
        if: steps.plan.outputs.website == 'true'
        run: node site/build.mjs
      - name: Verify standalone artifact
        if: steps.plan.outputs.website == 'true'
        run: node site/verify.mjs --artifact
      - name: Upload standalone artifact
        if: steps.plan.outputs.website == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vireo-website-${{ github.sha }}
          path: site/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
