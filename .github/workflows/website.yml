name: Build Vireo website

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build standalone website
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Verify source policy
        run: node site/verify.mjs

      - name: Test website rendering
        run: node --test site/build.test.mjs

      - name: Build standalone artifact
        run: node site/build.mjs

      - name: Verify standalone artifact
        run: node site/verify.mjs --artifact

      - name: Upload standalone artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vireo-website-${{ github.sha }}
          path: site/dist
          if-no-files-found: error
          retention-days: 30
