name: Deploy · Website — vireocode.com
run-name: Website deployment · ${{ github.event_name }} · ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # Main activation and reconciliation share one non-cancellable lock. A manual
  # non-main dispatch cannot replace a queued production deployment before the
  # job-level main guard rejects it.
  group: website-${{ github.ref == 'refs/heads/main' && 'production' || github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile interrupted website deployment
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: website-deployment
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Configure native OpenSSH receiver connection
        env:
          VIREO_WEBSITE_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.VIREO_WEBSITE_DEPLOY_SSH_PRIVATE_KEY }}
          VIREO_WEBSITE_DEPLOY_KNOWN_HOSTS: ${{ vars.VIREO_WEBSITE_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.VIREO_WEBSITE_DEPLOY_HOST }}
          PORT: ${{ vars.VIREO_WEBSITE_DEPLOY_PORT }}
          USER: ${{ vars.VIREO_WEBSITE_DEPLOY_USER }}
        run: |
          set -euo pipefail
          printf '%s' "$HOST" | grep -Eq '^([A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?|([0-9]{1,3}\.){3}[0-9]{1,3})$'
          printf '%s' "$PORT" | grep -Eq '^[1-9][0-9]{0,4}$'; test "$PORT" -le 65535
          printf '%s' "$USER" | grep -Eq '^[a-z_][a-z0-9_-]{0,31}$'
          umask 077; printf '%s\n' "$VIREO_WEBSITE_DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/website-deploy-key"
          printf '%s\n' "$VIREO_WEBSITE_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/website-known-hosts"
          ssh -i "$RUNNER_TEMP/website-deploy-key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/website-known-hosts" -p "$PORT" "$USER@$HOST" reconcile

  changes:
    name: Plan website deployment
    needs: reconcile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should-build: ${{ steps.plan.outputs.website }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan exact website deployment
        id: plan
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            node scripts/ci-change-plan.mjs --all --github-output "$GITHUB_OUTPUT"
          else
            node scripts/ci-change-plan.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
          fi
      - name: Summarize website deployment routing
        env:
          SHOULD_BUILD: ${{ steps.plan.outputs.website }}
        run: |
          case "$SHOULD_BUILD" in true|false) ;; *) exit 1 ;; esac
          printf '## Website deployment routing\n\n- Build and deployment selected: `%s`\n' "$SHOULD_BUILD" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build website deployment artifact
    needs: changes
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require a successful website deployment plan
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.should-build == 'true'
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.should-build == 'true'
        with:
          persist-credentials: false
      - name: Install website runtime dependencies
        if: needs.changes.outputs.should-build == 'true'
        run: corepack npm ci --ignore-scripts
      - name: Lint website source
        if: needs.changes.outputs.should-build == 'true'
        run: corepack npm exec -- eslint site
      - name: Check website formatting
        if: needs.changes.outputs.should-build == 'true'
        run: corepack npm exec -- prettier --check site
      - name: Verify source policy
        if: needs.changes.outputs.should-build == 'true'
        run: node site/verify.mjs
      - name: Test website rendering
        if: needs.changes.outputs.should-build == 'true'
        run: node --test site/build.test.mjs
      - name: Build standalone artifact
        if: needs.changes.outputs.should-build == 'true'
        run: node site/build.mjs
      - name: Verify standalone artifact
        if: needs.changes.outputs.should-build == 'true'
        run: node site/verify.mjs --artifact
      - name: Upload standalone artifact
        if: needs.changes.outputs.should-build == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vireo-website-${{ github.sha }}
          path: site/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy verified website artifact
    needs: [reconcile, changes, build]
    if: github.ref == 'refs/heads/main' && needs.reconcile.result == 'success' && needs.changes.outputs.should-build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    environment: website-deployment
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - name: Checkout exact main build identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the build commit is still main before activation
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Download the exact verified website artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vireo-website-${{ github.sha }}
          path: ${{ runner.temp }}/website-artifact
      - name: Build deterministic deployment envelope
        id: bundle
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node site/build-deployment-bundle.mjs "$RUNNER_TEMP/website-artifact" "$RUNNER_TEMP/website.tar" "$RUNNER_TEMP/website-bundle.json"
          node -e 'const b=require(process.argv[1]); for (const [k,v] of Object.entries({digest:b.archiveSha256,bytes:b.archiveBytes})) console.log(`${k}=${v}`)' "$RUNNER_TEMP/website-bundle.json" >> "$GITHUB_OUTPUT"
      - name: Configure native OpenSSH receiver connection
        env:
          VIREO_WEBSITE_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.VIREO_WEBSITE_DEPLOY_SSH_PRIVATE_KEY }}
          VIREO_WEBSITE_DEPLOY_KNOWN_HOSTS: ${{ vars.VIREO_WEBSITE_DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077; printf '%s\n' "$VIREO_WEBSITE_DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/website-deploy-key"
          printf '%s\n' "$VIREO_WEBSITE_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/website-known-hosts"
      - name: Upload, stage, activate, qualify, and accept exact website bytes
        env:
          HOST: ${{ vars.VIREO_WEBSITE_DEPLOY_HOST }}
          PORT: ${{ vars.VIREO_WEBSITE_DEPLOY_PORT }}
          USER: ${{ vars.VIREO_WEBSITE_DEPLOY_USER }}
          PUBLIC_URL: ${{ vars.VIREO_WEBSITE_PUBLIC_URL }}
          DIGEST: ${{ steps.bundle.outputs.digest }}
          BYTES: ${{ steps.bundle.outputs.bytes }}
        run: |
          set -euo pipefail
          test "$PUBLIC_URL" = "https://vireocode.com"
          printf '%s' "$HOST" | grep -Eq '^([A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?|([0-9]{1,3}\.){3}[0-9]{1,3})$'
          printf '%s' "$PORT" | grep -Eq '^[1-9][0-9]{0,4}$'; test "$PORT" -le 65535
          printf '%s' "$USER" | grep -Eq '^[a-z_][a-z0-9_-]{0,31}$'
          ssh_command=(ssh -i "$RUNNER_TEMP/website-deploy-key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/website-known-hosts" -p "$PORT" "$USER@$HOST")
          "${ssh_command[@]}" status > "$RUNNER_TEMP/website-status.json"
          cat "$RUNNER_TEMP/website.tar" | "${ssh_command[@]}" "upload $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT $GITHUB_REPOSITORY $GITHUB_SHA $DIGEST $BYTES"
          "${ssh_command[@]}" "stage $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT $GITHUB_REPOSITORY $GITHUB_SHA $DIGEST $BYTES" > "$RUNNER_TEMP/website-stage.json"
          test "$(node -p 'require(process.argv[1]).status' "$RUNNER_TEMP/website-stage.json")" != accepted || exit 0
          generation="$(node -p 'require(process.argv[1]).generation' "$RUNNER_TEMP/website-stage.json")"
          rollback() {
            "${ssh_command[@]}" status > "$RUNNER_TEMP/website-status-recovery.json" || return 0
            recovery_generation="$(node -e 'const s=require(process.argv[1]); const p=s.pending; process.stdout.write(p && p.runId===process.env.GITHUB_RUN_ID && p.attempt===process.env.GITHUB_RUN_ATTEMPT && p.commit===process.env.GITHUB_SHA && p.digest===process.env.DIGEST ? String(s.generation) : "")' "$RUNNER_TEMP/website-status-recovery.json")"
            test -n "$recovery_generation" || return 0
            "${ssh_command[@]}" "rollback $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT $GITHUB_REPOSITORY $GITHUB_SHA $DIGEST $BYTES $recovery_generation" || true
          }
          trap rollback ERR INT TERM
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          "${ssh_command[@]}" "activate $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT $GITHUB_REPOSITORY $GITHUB_SHA $DIGEST $BYTES $generation" > "$RUNNER_TEMP/website-activate.json"
          generation="$(node -p 'require(process.argv[1]).generation' "$RUNNER_TEMP/website-activate.json")"
          for path in /healthz / /docs/ /reference/ /versions/; do curl --fail --silent --show-error --max-time 20 "$PUBLIC_URL$path" > /dev/null; done
          headers="$(curl --fail --silent --show-error --head --max-time 20 "$PUBLIC_URL/")"
          printf '%s\n' "$headers" | grep -Fqi 'strict-transport-security:'
          printf '%s\n' "$headers" | grep -Fqi 'content-security-policy:'
          curl --fail --silent --show-error --max-time 20 "$PUBLIC_URL/.well-known/vireo-deployment.json" | GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_SHA="$GITHUB_SHA" node -e 'const c=[];process.stdin.on("data",x=>c.push(x));process.stdin.on("end",()=>{const p=JSON.parse(Buffer.concat(c));process.exit(p.repository===process.env.GITHUB_REPOSITORY&&p.commit===process.env.GITHUB_SHA?0:1)})'
          "${ssh_command[@]}" "accept $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT $GITHUB_REPOSITORY $GITHUB_SHA $DIGEST $BYTES $generation"
          trap - ERR INT TERM
      - name: Summarize website deployment
        if: always()
        run: |
          printf '## Website deployment\n\n- Target: https://vireocode.com\n- Activation is qualified and rolls back on failure.\n' >> "$GITHUB_STEP_SUMMARY"
