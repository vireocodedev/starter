name: Publish npm release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type publish to release every unpublished manifest version
        required: true
        type: string

concurrency:
  group: npm-public-release
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify npm release candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Confirm protected release intent
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$GITHUB_REF" = "refs/heads/main" && test "$CONFIRMATION" = "publish"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: corepack npm ci
      - name: Install Storybook contract browser
        run: corepack npm exec -- playwright install --with-deps chromium
      - name: Verify current Maven artifacts are public before npm publication
        run: ./jvm/scripts/verify-central-consumer.sh "$(node scripts/current-ecosystem-maven-version.mjs)"
      - run: corepack npm run gate:release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-candidate-${{ github.sha }}
          path: .release-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish public npm packages
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: package-release
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published-packages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          registry-url: https://registry.npmjs.org
          scope: "@vireocodedev"
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: corepack npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-candidate-${{ github.sha }}
          path: .release-evidence
      - name: Recheck immutable registry state
        run: corepack npm run release:validate
      - name: Publish reviewed candidate bytes with registry-backed provenance
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: corepack npm run release:publish-candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      - name: Verify the anonymous public release
        run: corepack npm run release:verify-public
      - name: Record publication or recovery summary
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          {
            if [ "$PUBLISHED" = "true" ]; then
              echo "## Published npm packages"
            else
              echo "## Recovered npm release"
              echo
              echo "All reviewed candidate bytes were already public; anonymous verification completed successfully."
            fi
            echo
            echo '```json'
            echo "${PUBLISHED_PACKAGES:-[]}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
