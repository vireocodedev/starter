name: Recover validated Maven Central deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact validated JVM version from jvm/gradle.properties
        required: true
        type: string
      deployment_id:
        description: Exact validated Central deployment UUID to promote
        required: true
        type: string
      confirmation:
        description: Type PUBLISH_VALIDATED_DEPLOYMENT to promote the existing deployment
        required: true
        type: string

concurrency:
  group: maven-central-recovery-${{ inputs.deployment_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  recover:
    name: Recover ${{ inputs.version }} from ${{ inputs.deployment_id }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: maven-central
    permissions:
      contents: read
    defaults:
      run:
        working-directory: jvm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm the explicit recovery request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != "PUBLISH_VALIDATED_DEPLOYMENT" ]]; then
            echo "Confirmation must exactly equal PUBLISH_VALIDATED_DEPLOYMENT." >&2
            exit 1
          fi

      - name: Confirm the existing deployment is safe to recover
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          actual_version="$(sed -n 's/^version=//p' gradle.properties)"
          if [[ "$actual_version" != "$REQUESTED_VERSION" ]]; then
            echo "Requested $REQUESTED_VERSION, but gradle.properties contains $actual_version." >&2
            exit 1
          fi
          artifact_url="https://repo1.maven.org/maven2/com/vireocode/vireo-bom/$actual_version/vireo-bom-$actual_version.pom"
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "$artifact_url")"
          case "$status" in
            404) echo "Version $actual_version is not yet public on Maven Central; recovering the existing validated deployment." ;;
            200) echo "Version $actual_version is already immutable on Maven Central." >&2; exit 1 ;;
            *) echo "Could not establish Maven Central publication state (HTTP $status)." >&2; exit 1 ;;
          esac

      - name: Promote the exact validated Central deployment
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: ./scripts/publish-central-deployment.sh "$DEPLOYMENT_ID" "$REQUESTED_VERSION"

      - name: Record the recovery publication state
        env:
          VERSION: ${{ inputs.version }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: |
          {
            echo "## Maven Central deployment recovery"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Deployment: \`$DEPLOYMENT_ID\`"
            echo "- Recovery mode: \`EXISTING_VALIDATED_DEPLOYMENT\`"
            echo "- Publication identity: \`6 artifacts / 7 exact PURLs\`"
            echo
            echo "Central confirmed this exact deployment is published. Run **Verify Maven Central release** with \`$VERSION\` to prove anonymous consumption."
          } >> "$GITHUB_STEP_SUMMARY"
