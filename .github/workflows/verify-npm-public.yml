name: Verify public npm release

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish Vireo ecosystem
    types:
      - completed

concurrency:
  group: verify-public-npm-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  activity:
    name: Classify exact combined release activity
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      npm-active: ${{ steps.activity.outputs.npm-active }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - id: activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/release-workflow-activity.mjs

  verify:
    name: Verify anonymous public consumer
    needs: activity
    if: >-
      always() && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository && needs.activity.result == 'success' &&
      needs.activity.outputs.npm-active == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - run: corepack npm ci --ignore-scripts
      - name: Resolve, compile, bundle, and authenticate the public packages
        run: corepack npm run release:verify-public
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-public-verification-${{ github.event.workflow_run.head_sha || github.sha }}
          path: npm-public-verification.json
          if-no-files-found: error
          retention-days: 90
