name: Verify public npm release

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish npm release
    types:
      - completed

concurrency:
  group: verify-public-npm-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify anonymous public consumer
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - run: corepack npm ci --ignore-scripts
      - name: Resolve, compile, bundle, and authenticate the public packages
        run: corepack npm run release:verify-public
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-public-verification-${{ github.event.workflow_run.head_sha || github.sha }}
          path: npm-public-verification.json
          if-no-files-found: error
          retention-days: 90
