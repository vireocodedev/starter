name: Verify Maven Central release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published JVM version to verify
        required: true
        type: string

concurrency:
  group: verify-maven-central-${{ inputs.version }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify public ${{ inputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Resolve and test the public release anonymously
        run: ./jvm/scripts/verify-central-consumer.sh "${{ inputs.version }}"
