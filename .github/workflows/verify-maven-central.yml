name: Verify Maven Central release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published JVM version to verify
        required: true
        type: string

concurrency:
  group: verify-maven-central-${{ inputs.version }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify public ${{ inputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: maven-central
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Resolve and test the public release anonymously
        run: ./jvm/scripts/verify-central-consumer.sh "${{ inputs.version }}"
