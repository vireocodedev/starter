name: Stage Maven Central release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact JVM version from jvm/gradle.properties
        required: true
        type: string
      publish:
        description: Publish the validated deployment to Maven Central (defaults to staging only)
        required: false
        default: false
        type: boolean

concurrency:
  group: maven-central-${{ inputs.version }}
  cancel-in-progress: false

permissions: {}

jobs:
  stage:
    name: Verify, sign, and release ${{ inputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # A Central validation and post-publish visibility transition may each take
    # up to twenty minutes. Keep the protected job alive long enough to prove
    # the requested publication rather than leaving an ambiguous handoff.
    timeout-minutes: 65
    environment: maven-central
    permissions:
      contents: read
    defaults:
      run:
        working-directory: jvm
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Confirm the immutable release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          actual_version="$(sed -n 's/^version=//p' gradle.properties)"
          if [[ "$actual_version" != "$REQUESTED_VERSION" ]]; then
            echo "Requested $REQUESTED_VERSION, but gradle.properties contains $actual_version." >&2
            exit 1
          fi
          artifact_url="https://repo1.maven.org/maven2/com/vireocode/vireo-bom/$actual_version/vireo-bom-$actual_version.pom"
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$artifact_url")"
          case "$status" in
            404) echo "Version $actual_version is not yet public on Maven Central." ;;
            200) echo "Version $actual_version is already immutable on Maven Central." >&2; exit 1 ;;
            *) echo "Could not establish Maven Central publication state (HTTP $status)." >&2; exit 1 ;;
          esac

      - name: Verify the JVM release candidate
        run: ./gradlew clean check aggregateJavadoc --no-build-cache
      - name: Enforce JVM third-party license policy
        run: node ../scripts/third-party-license-policy.mjs --ecosystem jvm
      - name: Verify isolated publication and consumer
        run: ./scripts/verify-publication-consumer.sh

      - name: Build and audit the signed Central bundle
        id: bundle
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: ./scripts/build-central-bundle.sh "$RUNNER_TEMP/central-bundle"

      - name: Preserve the exact signed release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-central-${{ steps.bundle.outputs.version }}-${{ github.sha }}
          path: ${{ steps.bundle.outputs.bundle }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload for user-managed Central validation
        id: central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: ./scripts/upload-central-bundle.sh "${{ steps.bundle.outputs.bundle }}" "vireo-jvm-${{ steps.bundle.outputs.version }}"

      - name: Wait for Central validation
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: ./scripts/wait-central-validation.sh "${{ steps.central.outputs.deployment-id }}"

      - name: Publish the validated Central deployment
        if: inputs.publish
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: ./scripts/publish-central-deployment.sh "${{ steps.central.outputs.deployment-id }}" "${{ steps.bundle.outputs.version }}"

      - name: Record the Central publication state
        env:
          VERSION: ${{ steps.bundle.outputs.version }}
          DEPLOYMENT_ID: ${{ steps.central.outputs.deployment-id }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          {
            echo "## Maven Central deployment"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Deployment: \`$DEPLOYMENT_ID\`"
            echo "- Upload mode: \`USER_MANAGED\`"
            echo "- Publication identity: \`6 artifacts / 7 exact PURLs\`"
            echo
            if [[ "$PUBLISH_REQUESTED" == "true" ]]; then
              echo "- Publication mode: \`PUBLISHED_AFTER_VALIDATION\`"
              echo
              echo "Central confirmed this exact deployment is published. Run **Verify Maven Central release** with \`$VERSION\` to prove anonymous consumption."
            else
              echo "- Publication mode: \`STAGE_ONLY\`"
              echo
              echo "Review and publish it from https://central.sonatype.com/publishing/deployments, then run **Verify Maven Central release** with \`$VERSION\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
