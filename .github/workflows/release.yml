name: Release

on:
  push:
    branches: [main]
  # A release is the one thing worth being able to start by hand: a publish that
  # failed halfway, or a version bump that needs to go out without a code change.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Write access is granted only to jobs that create release state.
permissions: {}

jobs:
  verify-typescript:
    name: Verify TypeScript release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@vireocodedev"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run verify -- silent

  verify-jvm:
    name: Verify JVM release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: jvm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
      - run: ./gradlew clean check aggregateJavadoc --no-build-cache
      - run: ./scripts/verify-publication-consumer.sh

  release-npm:
    name: Release npm packages
    needs: [verify-typescript, verify-jvm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@vireocodedev"
      # Dependency lifecycle scripts do not need release credentials. Package
      # lifecycle hooks still run later, as part of the deliberate publish.
      - run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release PR or publish to GitHub Packages
        id: changesets
        uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          publish: npm run release:publish
          version: npm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The two halves are versioned independently. A JVM version already present
  # in the registry is a safe no-op, so npm-only releases remain possible.
  publish-jvm:
    name: Publish JVM artifacts
    needs: [verify-jvm, release-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.registry.outputs.version }}
    defaults:
      run:
        working-directory: jvm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4

      - name: Decide whether this version is already published
        id: registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(./gradlew -q properties --property version | awk '/^version:/ {print $2}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          url="https://maven.pkg.github.com/vireocodedev/starter/com/vireocode/vireo-starter-bom/$version/vireo-starter-bom-$version.pom"
          status="$(curl -s -o /dev/null -w '%{http_code}' -u "x:$GITHUB_TOKEN" "$url")"
          case "$status" in
            200 | 302)
              echo "Version $version is already in GitHub Packages; nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "Version $version is not published yet."
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Could not determine publication state (HTTP $status)." >&2
              exit 1
              ;;
          esac

      - name: Publish to GitHub Packages
        if: steps.registry.outputs.publish == 'true'
        run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag-jvm:
    name: Tag JVM release
    needs: publish-jvm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Create the release tag when absent
        env:
          VERSION: ${{ needs.publish-jvm.outputs.version }}
        run: |
          tag="jvm-v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to tag."
          else
            git tag "$tag"
            git push origin "$tag"
          fi

  # Publishing succeeding is not the same as the artifacts being usable. This
  # resolves them the way a real consumer would, from an empty Gradle home.
  verify-consumption:
    name: Verify published JVM artifacts
    needs: publish-jvm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - name: Resolve the published artifacts with a cold Gradle cache
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish-jvm.outputs.version }}
        run: |
          GRADLE_USER_HOME="$RUNNER_TEMP/cold-gradle-home" ./jvm/gradlew \
            -p jvm/vireo-starter-publication-tests \
            -PvireoRepository=https://maven.pkg.github.com/vireocodedev/starter \
            -PvireoVersion="$VERSION" \
            clean check \
            --no-daemon \
            --no-build-cache
