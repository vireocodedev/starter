name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@vireocodedev"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release PR or publish to GitHub Packages
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The two halves are versioned independently - changesets bumps each npm
  # package on its own line, jvm/gradle.properties carries one version for all
  # six artifacts - and they release independently too. `version=` is the whole
  # signal: bump it and this job publishes, leave it and the registry check
  # below turns the job into a no-op.
  #
  # This deliberately does not gate on the npm release having published. The
  # lockstep rule in docs/BACKEND_PARITY.md is about the query-engine wire
  # contract moving on both sides in one PR, which is a review constraint, not
  # something CI can check - and gating here would make a backend-only release
  # impossible, which is exactly what the extraction itself was.
  jvm:
    needs: release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jvm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # A release that only touched packages/ leaves the JVM version untouched,
      # and GitHub Packages rejects a re-publish of an existing release version.
      # Skipping is the correct outcome there; failing would make every npm-only
      # release look broken.
      - name: Decide whether this version is already published
        id: registry
        run: |
          version="$(./gradlew -q properties --property version | awk '/^version:/ {print $2}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          url="https://maven.pkg.github.com/vireocodedev/starter/com/vireocode/vireo-starter-bom/$version/vireo-starter-bom-$version.pom"
          status="$(curl -s -o /dev/null -w '%{http_code}' -u "x:${{ secrets.GITHUB_TOKEN }}" "$url")"
          if [ "$status" = "200" ]; then
            echo "Version $version is already in GitHub Packages; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $version is not published yet (HTTP $status)."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # `publish` depends on apiSurfaceCheck, so a widened public surface with a
      # stale snapshot cannot reach the registry.
      - name: Publish to GitHub Packages
        if: steps.registry.outputs.publish == 'true'
        run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the JVM release
        if: steps.registry.outputs.publish == 'true'
        working-directory: .
        run: |
          tag="jvm-v${{ steps.registry.outputs.version }}"
          git tag "$tag"
          git push origin "$tag"

  # Publishing succeeding is not the same as the artifacts being usable. This
  # resolves them the way a real consumer would - from the registry, with an
  # empty Gradle home, with no project substitution available - which is the
  # only thing that proves the extraction actually landed.
  verify-consumption:
    needs: jvm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Resolve the published artifacts with a cold Gradle cache
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' jvm/gradle.properties)"
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer"

          # The repo's own wrapper, so the check runs on the Gradle version the
          # library is built with. GRADLE_USER_HOME is empty, so even the
          # distribution is fetched fresh.
          cp -r jvm/gradle jvm/gradlew "$consumer/"

          cat > "$consumer/settings.gradle" <<'EOF'
          rootProject.name = 'vireo-starter-consumption-check'
          EOF

          cat > "$consumer/build.gradle" <<EOF
          plugins { id 'java' }

          repositories {
              mavenCentral()
              maven {
                  url = 'https://maven.pkg.github.com/vireocodedev/starter'
                  credentials {
                      username = System.getenv('GITHUB_ACTOR')
                      password = System.getenv('GITHUB_TOKEN')
                  }
              }
          }

          dependencies {
              implementation platform('com.vireocode:vireo-starter-bom:$version')
              implementation 'com.vireocode:vireo-starter-core'
              implementation 'com.vireocode:vireo-starter-auth'
              implementation 'com.vireocode:vireo-starter-queryengine'
              implementation 'com.vireocode:vireo-starter-offline'
              implementation 'com.vireocode:vireo-starter-history'
          }

          // The BOM has to supply every version, so nothing above is pinned.
          tasks.register('resolve') {
              def classpath = configurations.runtimeClasspath
              doLast {
                  println "Resolved \${classpath.files.size()} jars"
              }
          }
          EOF

          cd "$consumer"
          GRADLE_USER_HOME="$RUNNER_TEMP/cold-gradle-home" ./gradlew resolve --no-daemon
