name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@vireocodedev"
      # The @rgo scope lives on a private registry; inject its token (from the
      # RGO_TOKEN repo secret) so workspaces depending on @rgo/front-ui resolve.
      - name: Authenticate to the @rgo registry
        run: echo "//git.rgo.hr/api/packages/RGO/npm/:_authToken=${RGO_TOKEN}" >> .npmrc
        env:
          RGO_TOKEN: ${{ secrets.RGO_TOKEN }}
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release PR or publish to GitHub Packages
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
