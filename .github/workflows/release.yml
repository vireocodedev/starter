name: Maintain npm release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-release-pr-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    name: Create or update the npm release PR
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - run: corepack npm ci --ignore-scripts
      - name: Create or update the Changesets release PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: corepack npm run version-packages
          commit: "chore(npm): version public packages"
          title: "chore(npm): version public packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
