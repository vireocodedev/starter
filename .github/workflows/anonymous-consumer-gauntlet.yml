name: Anonymous consumer gauntlet

on:
  pull_request:
    paths:
      - ".github/workflows/anonymous-consumer-gauntlet.yml"
      - "contracts/anonymous-consumer-gauntlet-policy.json"
      - "contracts/ecosystem-release-contract.json"
      - "contracts/project-upgrade-policy.json"
      - "contracts/public-release-attestation-policy.json"
      - "scripts/anonymous-consumer-gauntlet.mjs"
      - "scripts/anonymous-consumer-gauntlet.test.mjs"
      - "scripts/lib/anonymous-consumer-*.mjs"
      - "scripts/verify-npm-public-release.mjs"
      - "scripts/collect-public-release-evidence.mjs"
      - "scripts/verify-public-maven-signatures.mjs"
      - "jvm/scripts/verify-central-consumer.sh"
      - "packages/create-vireo/**"
      - "contracts/application-projection-contract.json"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      release_id:
        required: false
        type: string
      source_commit:
        required: false
        type: string
  workflow_run:
    workflows: ["Publish npm release"]
    types: [completed]
  schedule:
    - cron: "17 3 * * 2"

permissions: {}

concurrency:
  group: anonymous-consumer-gauntlet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack npm ci --ignore-scripts
      - run: corepack npm run consumer:gauntlet:check
      - run: node --test scripts/anonymous-consumer-gauntlet.test.mjs scripts/lib/anonymous-consumer-*.test.mjs
  gauntlet:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    env:
      VIREO_GAUNTLET_PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/vireo-anonymous-playwright
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/vireo-anonymous-playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack npm ci --ignore-scripts
      - run: docker version
      - run: corepack npm exec -- playwright install --with-deps chromium
      - run: corepack npm run consumer:gauntlet -- --evidence-dir anonymous-consumer-evidence
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anonymous-consumer-gauntlet-evidence
          path: anonymous-consumer-evidence
          if-no-files-found: error
          retention-days: 90
