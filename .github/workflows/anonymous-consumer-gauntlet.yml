name: Anonymous consumer gauntlet

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2"

permissions: {}

concurrency:
  group: anonymous-consumer-gauntlet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gauntlet:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack npm ci --ignore-scripts
      - run: docker version
      - run: corepack npm exec -- playwright install --with-deps chromium
      - run: corepack npm run consumer:gauntlet -- --evidence-dir anonymous-consumer-evidence
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anonymous-consumer-gauntlet-evidence
          path: anonymous-consumer-evidence
          if-no-files-found: warn
          retention-days: 90
