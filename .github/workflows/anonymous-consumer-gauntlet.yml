name: Anonymous consumer gauntlet

on:
  pull_request:
    paths:
      - ".github/workflows/anonymous-consumer-gauntlet.yml"
      - "contracts/anonymous-consumer-gauntlet-policy.json"
      - "contracts/ecosystem-release-contract.json"
      - "contracts/project-upgrade-policy.json"
      - "contracts/public-release-attestation-policy.json"
      - "scripts/anonymous-consumer-gauntlet.mjs"
      - "scripts/anonymous-consumer-gauntlet.test.mjs"
      - "scripts/lib/anonymous-consumer-*.mjs"
      - "scripts/lib/anonymous-public-evidence*.mjs"
      - "scripts/lib/anonymous-public-maven-evidence*.mjs"
      - "scripts/verify-npm-public-release.mjs"
      - "scripts/collect-public-release-evidence.mjs"
      - "scripts/verify-public-maven-signatures.mjs"
      - "scripts/verify-anonymous-consumer-signed-sboms.mjs"
      - "scripts/verify-anonymous-consumer-signed-sboms.test.mjs"
      - "contracts/vireo-release-signing-key.asc"
      - "jvm/scripts/verify-central-consumer.sh"
      - "packages/create-vireo/**"
      - "contracts/application-projection-contract.json"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      release_id:
        required: false
        type: string
      source_commit:
        required: false
        type: string
  workflow_run:
    workflows: ["Publish npm release"]
    types: [completed]
  schedule:
    - cron: "17 3 * * 2"

permissions: {}

concurrency:
  group: anonymous-consumer-gauntlet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack npm ci --ignore-scripts
      - run: corepack npm run consumer:gauntlet:check
      - run: >-
          node --test
          scripts/anonymous-consumer-gauntlet.test.mjs
          scripts/verify-anonymous-consumer-signed-sboms.test.mjs
          scripts/lib/anonymous-consumer-*.test.mjs
  gauntlet:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    env:
      VIREO_GAUNTLET_PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/vireo-anonymous-playwright
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/vireo-anonymous-playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit || (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha) }}
          persist-credentials: false
      - id: source
        run: |
          requested='${{ inputs.source_commit }}'
          if [ -n "$requested" ] && ! printf '%s' "$requested" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "workflow_dispatch source_commit must be an exact 40-hex commit" >&2
            exit 1
          fi
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: corepack npm ci --ignore-scripts
      - id: release
        run: echo "release_id=$(node -p \"require('./contracts/ecosystem-release-contract.json').current.id\")" >> "$GITHUB_OUTPUT"
      - run: docker version
      - run: corepack npm exec -- playwright install --with-deps chromium
      - run: corepack npm run consumer:gauntlet -- --evidence-dir anonymous-consumer-evidence --release-id "${{ inputs.release_id || steps.release.outputs.release_id }}" --source-commit "${{ steps.source.outputs.source_commit }}"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anonymous-consumer-gauntlet-evidence
          path: anonymous-consumer-evidence
          if-no-files-found: error
          retention-days: 90

  verify-signed-sboms:
    name: Verify signed public SBOM attestations
    needs: gauntlet
    if: >-
      always() && github.event_name != 'pull_request' && needs.gauntlet.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit || (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha) }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: anonymous-consumer-gauntlet-evidence
          path: anonymous-consumer-evidence
      - name: Verify every exact public subject's signed CycloneDX SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/verify-anonymous-consumer-signed-sboms.mjs
          --evidence-dir anonymous-consumer-evidence
          --output anonymous-consumer-signed-sbom-evidence/signed-sbom-verification.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anonymous-consumer-signed-sbom-evidence
          path: anonymous-consumer-signed-sbom-evidence
          if-no-files-found: error
          retention-days: 90
