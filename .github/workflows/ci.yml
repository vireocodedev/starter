name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@vireocodedev"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Build first: workspace consumers (e.g. queryengine) resolve sibling
      # packages via their published `exports`/`types` (dist), so the dist must
      # exist before typecheck/test run. `--workspaces` builds localization
      # before queryengine.
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test
