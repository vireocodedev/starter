name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "13 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: TypeScript
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # setup-node probes its bundled npm. Run it before checkout so npm 11 does
      # not evaluate the repository's strict npm 12 devEngines declaration.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: corepack npm ci
      # This is the same ordered merge gate developers run locally. It includes
      # linting, formatting, package builds, type checking, tests and contract
      # checks, strict consumer declarations, generator tests, and the Vireo
      # Storybook production build.
      - run: corepack npm run gate:fast
      - name: Upload verification performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verification-evidence/latest.json
          if-no-files-found: ignore
          retention-days: 90

  # Deliberately a sibling of the TypeScript job rather than a step inside it.
  # The two halves of the starter are released together because they live in one
  # repository, not because they share a task graph — neither job can see the
  # other's toolchain, and neither needs to.
  jvm:
    name: JVM
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: jvm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: ./gradlew build aggregateJavadoc
      - name: Verify locally published artifacts through an external consumer
        run: ./scripts/verify-publication-consumer.sh

  generated-entity:
    name: Generated full-stack fixture
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: corepack npm ci
      - run: corepack npm run build --workspace=create-vireo
      - run: corepack npm run generate:entity:fixture

  generated-frontend:
    name: Generated frontend-only fixture
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: corepack npm ci
      - run: corepack npm run build --workspace=create-vireo
      - run: corepack npm run generate:frontend:fixture

  project-upgrade:
    name: Project upgrade 0.2.0 to 0.3.0
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: corepack npm ci
      - run: corepack npm run build --workspace=create-vireo
      - run: corepack npm run upgrade:project:fixture
