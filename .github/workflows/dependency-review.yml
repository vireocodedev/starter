name: Dependency review

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  changes:
    name: Plan dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      dependency-review: ${{ steps.plan.outputs.dependency-review }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plan exact dependency review
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          planner_root="$RUNNER_TEMP/ci-change-plan-base"
          if git cat-file -e "$BASE_SHA:scripts/ci-change-plan.mjs" && git cat-file -e "$BASE_SHA:contracts/ci-change-plan-policy.json"; then
            git worktree add --detach "$planner_root" "$BASE_SHA"
            trap 'git worktree remove --force "$planner_root"' EXIT
            node "$planner_root/scripts/ci-change-plan.mjs" --base "$BASE_SHA" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT"
          else
            cat >> "$GITHUB_OUTPUT" <<'EOF'
          typescript=true
          jvm=true
          generated-frontend=true
          generated-fullstack=true
          project-upgrade=true
          gauntlet-plan=true
          website=true
          codeql-java=true
          codeql-javascript=true
          dependency-review=true
          full=true
          reason=base-planner-unavailable; running complete suite
          EOF
          fi

  dependency-review:
    needs: changes
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require a successful dependency-review plan
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Report dependency-review routing decision
        if: needs.changes.result == 'success'
        env:
          PLAN_SELECTED: ${{ needs.changes.outputs.dependency-review }}
        run: |
          case "$PLAN_SELECTED" in true|false) ;; *) exit 1 ;; esac
          printf 'Dependency review selected=%s\n' "$PLAN_SELECTED"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.dependency-review == 'true'
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: needs.changes.outputs.dependency-review == 'true'
        with:
          fail-on-severity: moderate
