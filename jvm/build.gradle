plugins {
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.adarshr.test-logger' version '4.0.0' apply false
}

subprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }
}

// The BOM is a java-platform, so it deliberately opts out of the Java
// convention below. Everything else is a plain library: no Spring Boot plugin,
// because these modules are consumed as jars and must never produce a fat jar
// or an executable manifest.
configure(subprojects.findAll { it.name != 'vireo-starter-bom' }) {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.adarshr.test-logger'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        // Not for publication yet — that is roadmap 3.8. They are here because
        // building the javadoc jar is the only thing that actually compiles the
        // doc comments, and a library's docs are part of its surface.
        withSourcesJar()
        withJavadocJar()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        }
    }

    // Spring MVC resolves @PathVariable / @RequestParam / @RequestBody argument
    // names by reflection. The Spring Boot Gradle plugin normally adds this for
    // us; these modules do not apply it, so it has to be explicit.
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-parameters'
        options.encoding = 'UTF-8'
    }

    // Catches broken {@link} targets and malformed HTML, which are the doc
    // defects that mislead a consumer. "-missing" because requiring an @param
    // on every method buys noise rather than accuracy.
    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:all,-missing', '-quiet')
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        compileOnly "org.projectlombok:lombok-mapstruct-binding:0.2.0"
        annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        testAnnotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}
