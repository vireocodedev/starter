description = 'Metadata-driven filtering, sorting and relation options, plus per-user saved filters.'

dependencies {
    api project(':vireo-core')

    // Saved filters are owned by a user row, so the query engine compiles
    // against the default auth module. Removing this edge means giving
    // SavedFilter a plain owner id instead of a mapped relation, which is a
    // schema decision rather than a build one.
    api project(':vireo-auth')
}
