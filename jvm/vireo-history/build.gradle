description = 'Append-only audit log of every create, update and delete performed through BaseService.'

dependencies {
    api project(':vireo-core')
    // Published V1 references app_user. Keep Auth at runtime so a fresh install
    // can apply that immutable migration before V2 removes the foreign key.
    runtimeOnly project(':vireo-auth')
    compileOnly 'io.micrometer:micrometer-observation'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
}

sourceSets {
    test {
        resources.srcDir "${rootProject.projectDir}/../contracts"
    }
}
