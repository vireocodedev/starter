plugins {
    id 'java-platform'
}

description = 'Version alignment for the Vireo JVM modules. Consumers import this platform instead of pinning each artifact.'

group = rootProject.group
version = rootProject.version

// Consumers import this once and then declare the modules they want without
// versions. It also pins the Spring Boot line the modules were compiled
// against, so a consumer cannot silently drift onto an incompatible one.
javaPlatform {
    allowDependencies()
}

dependencies {
    api platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")

    constraints {
        api project(':vireo-core')
        api project(':vireo-auth')
        api project(':vireo-query')
        api project(':vireo-offline')
        api project(':vireo-history')

        // Security floors that supersede versions in the imported Spring Boot
        // and Springdoc graphs until those upstream platforms carry the fixes.
        api "com.fasterxml.jackson.core:jackson-databind:${jacksonDatabindVersion}"
        api "org.apache.tomcat.embed:tomcat-embed-core:${tomcatVersion}"
        api "org.apache.tomcat.embed:tomcat-embed-el:${tomcatVersion}"
        api "org.apache.tomcat.embed:tomcat-embed-websocket:${tomcatVersion}"
        api "org.webjars:swagger-ui:${swaggerUiVersion}"
    }
}

def alignedModules = rootProject.ext.publishedModules.findAll { it != project.name }
def expectedManagedCoordinates = alignedModules.collect { "${project.group}:${it}:${project.version}" } + [
        "com.fasterxml.jackson.core:jackson-databind:${jacksonDatabindVersion}",
        "org.apache.tomcat.embed:tomcat-embed-core:${tomcatVersion}",
        "org.apache.tomcat.embed:tomcat-embed-el:${tomcatVersion}",
        "org.apache.tomcat.embed:tomcat-embed-websocket:${tomcatVersion}",
        "org.webjars:swagger-ui:${swaggerUiVersion}",
]
def expectedImportedPlatform = "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
def declaredModuleCoordinates = configurations.api.dependencyConstraints.collect {
    "${it.group}:${it.name}:${it.versionConstraint.requiredVersion}"
}
def declaredPlatformCoordinates = configurations.api.dependencies.collect {
    "${it.group}:${it.name}:${it.version}"
}

def bomContractCheck = tasks.register('bomContractCheck', com.vireocode.build.BomContractCheckTask) {
    group = 'verification'
    description = 'Verifies the Gradle platform model and generated Maven BOM.'
    bomCoordinate.set("${project.group}:${project.name}:${project.version}")
    expectedModuleCoordinates.set(expectedManagedCoordinates)
    actualModuleCoordinates.set(declaredModuleCoordinates)
    expectedPlatformCoordinate.set(expectedImportedPlatform)
    if (declaredPlatformCoordinates.size() != 1) {
        throw new GradleException("The BOM must import exactly one upstream platform; found ${declaredPlatformCoordinates}.")
    }
    actualPlatformCoordinate.set(declaredPlatformCoordinates[0])
    pomFile.set(layout.buildDirectory.file('publications/maven/pom-default.xml'))
    upToDateMarker.set(layout.buildDirectory.file('bom-contract/checked.txt'))
    dependsOn tasks.named('generatePomFileForMavenPublication')
}

tasks.named('check') {
    dependsOn bomContractCheck
}

tasks.withType(org.gradle.api.publish.maven.tasks.AbstractPublishToMaven).configureEach {
    dependsOn bomContractCheck
}
