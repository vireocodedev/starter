description = 'Proves a consumer gets full wiring from the dependencies alone, and can replace any single bean. Never published.'

dependencies {
    testImplementation project(':vireo-starter-core')
    testImplementation project(':vireo-starter-auth')
    testImplementation project(':vireo-starter-queryengine')
    testImplementation project(':vireo-starter-offline')
    testImplementation project(':vireo-starter-history')

    testImplementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway'

    testRuntimeOnly 'com.h2database:h2'

    // The library's migrations have to hold up on the vendor a consumer actually
    // deploys to, not only on the in-memory database the suite defaults to.
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.postgresql:postgresql'
    testRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
}
