spring.datasource.url=jdbc:h2:mem:consumer;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema comes from migrations, as it does in a real deployment: the library's
# from its own modules, the consumer's from db/migration here. `validate` rather
# than `none` so that a drift between a library entity and the library migration
# that is supposed to back it fails the build instead of surfacing at runtime.
spring.jpa.hibernate.ddl-auto=validate
