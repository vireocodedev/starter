spring.datasource.url=jdbc:h2:mem:consumer;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema comes from the entities on purpose. Flyway ownership is split in a
# later step; until then, letting Hibernate create the tables doubles as proof
# that the library's entities were discovered at all.
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
