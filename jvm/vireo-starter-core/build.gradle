description = 'Base entity, service and mapper primitives, REST error handling, and the seams the optional modules plug into.'

dependencies {
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-webmvc'
    api 'org.springframework.boot:spring-boot-starter-security'
    api "org.mapstruct:mapstruct:${mapstructVersion}"
    api 'org.openapitools:jackson-databind-nullable:0.2.6'

    // Every module's controllers carry @Tag / @Operation, so this is part of
    // the compile surface rather than an implementation detail.
    api "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
}
